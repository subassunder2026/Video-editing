<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.configurable && desc.get && !desc.set) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: desc.enumerable,
              get: desc.get,
              set: function () {},
            });
          }
        } catch (_) {}
        window.addEventListener(
          'error',
          function (event) {
            var src = (event && event.filename) || '';
            var stack = (event && event.error && event.error.stack) || '';
            if (
              src.indexOf('chrome-extension://') === 0 ||
              stack.indexOf('chrome-extension://') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
    <title>ChromaGrade — Professional Color Grading Workstation</title>
    <meta name="description" content="Professional GPU-accelerated color grading workstation with primary and log color wheels, 6-zone HDR grading, spline and Hue/Sat/Lum curves, HSL qualifier, serial nodes, live broadcast scopes, and 3D LUT export." />

    <meta property="og:description" content="GPU-accelerated color grading with Lift/Gamma/Gain/Offset wheels, 6-zone HDR controls, RGB & HSL curves, and live broadcast video scopes." />
